# Local Postgres for development and tests. Production uses Neon.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booker
      POSTGRES_PASSWORD: booker
      POSTGRES_DB: booker
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booker -d booker"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
